[workspace]
resolver = "2"
members = ["crates/homeway-core", "crates/homeway-cli", "crates/homeway-capi", "crates/homeway-quic"]
# 独立 workspace 的排除项：
#   fuzz           = nightly + cargo-fuzz（不进 cargo test --workspace——G-10）
#   tools/quic-ab  = QUIC 实验台探针（**必需**：它自带 [patch] ring 的真 ring 臂，
#                    不被根 [patch] 换垫片，否则「真 ring 诊断臂」当场失真——M0 设计 §4.4）
#   tools/quic-probe = M1 S1c 的探针客户端（harness-only：RPK 钉定自定义 verifier 的
#                    `dangerous()` 安装点 + relay 信封组帧）；产品面隔离门只扫 crates/，
#                    独立 workspace 让它与产品面隔离（同 tools/quic-ab 先例）
#   tools/m1-ab    = M1 S5-2/S5-3 的**产品路径**端到端吞吐台（harness-only：把
#                    homeway-core::facade / homeway-quic 当库驱动——只用它们的公开面，
#                    不含产品代码改动；独立 workspace 同 tools/quic-probe 先例）
exclude = ["fuzz", "tools/quic-ab", "tools/quic-probe", "tools/m1-ab"]

[workspace.package]
version = "0.2.3"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# QUIC DATAGRAM 载荷类型（M1 必需：`quinn::send_datagram` 只收 `bytes::Bytes`，
# 而 quinn **不 re-export** bytes ⇒ 消费侧必须直接声明，见 M1 设计 §1.5）。
bytes = "1"
homeway-core = { path = "crates/homeway-core" }
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
# `static_secrets` = `StaticSecret`（+ `PublicKey::from(&StaticSecret)`）的**隐藏依赖**：
# 此前由 boringtun 的依赖声明（`x25519-dalek/static_secrets,reusable_secrets`）经
# feature 合一顺带打开；M5 删 boringtun 后若不同批显式补，`identity.rs` / `server/state.rs`
# / `relay/**` / `engine.rs` 等 8+ 处立刻 E0432（报错点远离删除点——M5 设计 §7.3-1 实测）。
# ⇒ S1 先补，不等 C 棒删依赖（本仓只用 `StaticSecret::from([u8;32])`/`PublicKey` 两面，
# 不引 `reusable_secrets`）。
x25519-dalek = { version = "2.0.0-rc.3", features = ["static_secrets"] }
getrandom = { version = "0.2", features = ["std"] }
# boringtun 0.6 钉 ring 0.16（无 OHOS 支持）⇒ 下方 [patch] 换同算法垫片
# （R0 就位、R1 数据面消费；垫片源码 tools/ring-shim/，配方源自
#  tier:tools/spikes/rust-ohos-poc/ring-shim/，**依赖组合勿改**——PoC 已实测）
boringtun = "0.6"
# 0.14 起 TCP 拥塞控制按算法 feature 门控（R8-8a：CUBIC——R6.6 的 CC 垫片即 CUBIC
# 增长律，迁移后由上游 RFC 合规实现替代）。R8-2 曾加开 reno feature 做真机归因消融
# 对照臂（HOMEWAY_CC=reno）——该 env 已在 R8 收尾批删除、`crates/**` 零引用 ⇒ **M5 C3
# 删除死 feature**（A 棒复核结论；CUBIC 为唯一算法，与 Go gVisor 的 Reno 差异为登记差异）。
# Q-K F5-a/F5-c（2026-10-08）：`fragmentation-buffer-size-65536` 把 TX 分片缓冲从
# 默认 1500 抬到 64 KiB（恢复 Go 能力——此前 >1472 载荷在客户端 TX 被静默丢，R4）；
# `reassembly-buffer-count-8` 把入站重组并发槽从默认 1 抬到 8（并发大回复，F5-c）。
# **同一编译单元**下出口拦截栈的分片缓冲同步抬高 ⇒ 出口→客户端方向的大 UDP 回复
# 真的开始分片（线上形态 1 包变 N 包——登记见 INTEROP-CRITERIA）；这要求同批落地
# F5-d（出口 TX 反重写分片感知），否则只是把「静默丢」换成「分片后校验和被写坏」。
smoltcp = { version = "0.14", features = [
    "socket-tcp-cubic",
    "fragmentation-buffer-size-65536",
    "reassembly-buffer-count-8",
] }
libc = "0.2"
# ---- R6 term 服务面：alacritty_terminal 0.26 = 仿真+Damage+kitty 模式位
# （应答器与键/鼠标/焦点编码器自建，设计见 docs/reviews/R6-design.md）；
# portable-pty 替换 Go creack/pty（零降级超集已核实：raw fd/process_group_leader/resize）。----
alacritty_terminal = "0.26"
portable-pty = "0.9"
flate2 = "1"
fnv = "1"
regex = "1"
# ---- M0 传输层换代（WG → QUIC）依赖面：只被 crates/homeway-quic（岛）消费 ----
# 纪律（M0 设计 §3.4 层 0/层 1）：homeway-core / homeway-cli / homeway-capi 一律不声明
# 这三条——「同步面写不出异步代码」靠此成为编译期事实（写 `use tokio::…` 直接 E0433），
# 并由 tools/check-quic-isolation.sh 逐条断言。
# quinn：默认 features 全关（platform-verifier/bloom/log 都不要——M2 走 RPK 钉定，
#        logf 自有一切判据行）；rustls-ring 明确选 ring 后端，runtime-tokio = tokio 后端。
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
# rustls：**默认 features 必须关**（默认含 aws_lc_rs + prefer-post-quantum ⇒ 拉
#        aws-lc-sys = BoringSSL 派生 + cmake，OHOS 不可行）；tls12/logging 不需要
#        （QUIC 恒 TLS1.3）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# tokio：rt = current_thread 宿主；time = 预算/节拍；sync = 命令通道；macros = select!
#        （**只为 select!**——仍不用 #[tokio::main]，单线程不变量不受影响）。
#        不启 rt-multi-thread（单线程是结构不变量，不启用即编译期约束）。
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros"] }

[patch.crates-io]
ring = { path = "tools/ring-shim" }

# ---- M5 S1 构建档位（设计 §0.3/§0.4 + §15-1 主会话裁决；登记 = §8.5-L-1） ----
# 本仓**首次**引入 `[profile.*]`（M0–M4 全过程口径 = 无 profile 档）。
# 依据：不改档位则 §0.3.3-bis 实测「删完 WG 仍 4.34–4.59MB」⇒ 路线判据 3.8MB 不可达；
# 改档（本仓实测）双栈 4,891,776 B → 3,556,520 B（−27.3%），不改任何产品行为。
# **同档对比纪律**：跨档读数不得互引（`[size]` 登记须带档位限定语——L-1）；
# `opt-level` 保持默认 3（`opt-level="s"` 是已实测的后备路径，与 LTO 档**不可同引**）；
# `panic` 保持 `unwind`（岛内 `catch_unwind` 依赖 unwind——设计 §0.3.1）。
[profile.release]
lto = true
codegen-units = 1
