[workspace]
resolver = "2"
members = ["crates/homeway-core", "crates/homeway-cli", "crates/homeway-capi", "crates/homeway-quic"]
# 两个独立 workspace 的排除项：
#   fuzz           = nightly + cargo-fuzz（不进 cargo test --workspace——G-10）
#   tools/quic-ab  = QUIC 实验台探针（**必需**：它自带 [patch] ring 的真 ring 臂，
#                    不被根 [patch] 换垫片，否则「真 ring 诊断臂」当场失真——M0 设计 §4.4）
exclude = ["fuzz", "tools/quic-ab"]

[workspace.package]
version = "0.2.3"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# QUIC DATAGRAM 载荷类型（M1 必需：`quinn::send_datagram` 只收 `bytes::Bytes`，
# 而 quinn **不 re-export** bytes ⇒ 消费侧必须直接声明，见 M1 设计 §1.5）。
bytes = "1"
homeway-core = { path = "crates/homeway-core" }
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
x25519-dalek = "2.0.0-rc.3"
getrandom = { version = "0.2", features = ["std"] }
# boringtun 0.6 钉 ring 0.16（无 OHOS 支持）⇒ 下方 [patch] 换同算法垫片
# （R0 就位、R1 数据面消费；垫片源码 tools/ring-shim/，配方源自
#  tier:tools/spikes/rust-ohos-poc/ring-shim/，**依赖组合勿改**——PoC 已实测）
boringtun = "0.6"
# 0.14 起 TCP 拥塞控制按算法 feature 门控（R8-8a：CUBIC——R6.6 的 CC 垫片即 CUBIC
# 增长律，迁移后由上游 RFC 合规实现替代）。R8-2 加开 reno feature：真机归因消融
# 对照臂（HOMEWAY_CC=reno——Go gVisor 默认 Reno，同机 A/B 消除算法差；不设即恒
# CUBIC，产品行为不变）。
smoltcp = { version = "0.14", features = ["socket-tcp-cubic", "socket-tcp-reno"] }
libc = "0.2"
# ---- R6 term 服务面：alacritty_terminal 0.26 = 仿真+Damage+kitty 模式位
# （应答器与键/鼠标/焦点编码器自建，设计见 docs/reviews/R6-design.md）；
# portable-pty 替换 Go creack/pty（零降级超集已核实：raw fd/process_group_leader/resize）。----
alacritty_terminal = "0.26"
portable-pty = "0.9"
flate2 = "1"
fnv = "1"
regex = "1"
# ---- M0 传输层换代（WG → QUIC）依赖面：只被 crates/homeway-quic（岛）消费 ----
# 纪律（M0 设计 §3.4 层 0/层 1）：homeway-core / homeway-cli / homeway-capi 一律不声明
# 这三条——「同步面写不出异步代码」靠此成为编译期事实（写 `use tokio::…` 直接 E0433），
# 并由 tools/check-quic-isolation.sh 逐条断言。
# quinn：默认 features 全关（platform-verifier/bloom/log 都不要——M2 走 RPK 钉定，
#        logf 自有一切判据行）；rustls-ring 明确选 ring 后端，runtime-tokio = tokio 后端。
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
# rustls：**默认 features 必须关**（默认含 aws_lc_rs + prefer-post-quantum ⇒ 拉
#        aws-lc-sys = BoringSSL 派生 + cmake，OHOS 不可行）；tls12/logging 不需要
#        （QUIC 恒 TLS1.3）。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# tokio：rt = current_thread 宿主；time = 预算/节拍；sync = 命令通道；macros = select!
#        （**只为 select!**——仍不用 #[tokio::main]，单线程不变量不受影响）。
#        不启 rt-multi-thread（单线程是结构不变量，不启用即编译期约束）。
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros"] }

[patch.crates-io]
ring = { path = "tools/ring-shim" }
