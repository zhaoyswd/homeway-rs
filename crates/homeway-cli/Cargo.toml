[package]
name = "homeway-cli"
description = "homeway：生产出口/中继/客户端/daemon 统一二进制（零参 = 统一进程；v0.2.3）"
version.workspace = true
license.workspace = true
edition.workspace = true

# 二进制名 = `homeway`（WIN 批 2026-10-13 用户指令：发布产物不带 -cli 后缀；
# 包名 homeway-cli 不动——`-p homeway-cli` 的构建/脚本契约零波及）。
[[bin]]
name = "homeway"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
homeway-core.workspace = true
toml.workspace = true
libc.workspace = true
base64.workspace = true
serde.workspace = true
sha2.workspace = true
getrandom.workspace = true
# update 频道：Release tar.gz 解包（纯 Rust 后端；2026-10-23 批）
flate2.workspace = true
thiserror.workspace = true

# TUI 仅在支持 term 服务的 Unix CLI 编译，不进入 core/capi 的依赖图。
[target.'cfg(not(windows))'.dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29"

# WIN 批（2026-10-13）：windows 系统面（控制台事件——stopsig；spawn flags）。
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# 单测面无额外依赖：openpty 在当前 libc 版本已是主库符号（老的 libutil feature
# 已并入——Linux/macOS 均直接可用）。此节留空作占位说明。

[features]
# 透传 homeway-core 的故障注入缝（阶梯时间窗实测用）
test-seams = ["homeway-core/test-seams"]
