[package]
name = "homeway-cli"
description = "homeway：生产出口/中继/客户端/daemon 统一二进制（零参 = 统一进程；v0.2.3）"
version.workspace = true
edition.workspace = true

# 二进制名 = `homeway`（WIN 批 2026-10-13 用户指令：发布产物不带 -cli 后缀；
# 包名 homeway-cli 不动——`-p homeway-cli` 的构建/脚本契约零波及）。
[[bin]]
name = "homeway"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
homeway-core.workspace = true
toml.workspace = true
libc.workspace = true
base64.workspace = true
serde.workspace = true
sha2.workspace = true
getrandom.workspace = true

# WIN 批（2026-10-13）：windows 系统面（控制台事件——stopsig；spawn flags）。
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[features]
# 透传 homeway-core 的故障注入缝（阶梯时间窗实测用）
test-seams = ["homeway-core/test-seams"]
