[package]
name = "homeway-core"
description = "homeway 的 Rust 平行实现：协议底座与共享语义（对齐基线见仓 docs/BASELINE.md）"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror.workspace = true
base64.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
x25519-dalek.workspace = true
getrandom.workspace = true
smoltcp.workspace = true
libc.workspace = true
# R1 数据面消费（noise 握手）；R0 先就位以验 ring 垫片 [patch] 组装
boringtun.workspace = true
# 端点缓存落盘（与 Go 字节对齐的持久化 JSON——键序/omitempty 语义面，R2）
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
libc = "0.2"

[features]
# 测试缝：故障注入面（阶梯 R2 档的 poison-socket 等）——CLI 以同名 feature 透传启用。
test-seams = []
