name: ci

# 公开仓 CI（转正 A 批）。语义对齐本地七步门 tools/ci-local.sh 的可公开子集：
#   - clippy -D warnings（linux runner——sendmmsg 等平台分支在 linux 面编译才覆盖）
#   - cargo test --workspace（ubuntu + macOS 双面）
#   - 交叉 check：aarch64-unknown-linux-ohos（鸿蒙核面，纯 check 无需 NDK——
#     .cargo/config.toml 的 OHOS linker 只在链接期生效）+ musl 双架构（发版产物面）
# 本地-only 的门（基线克隆/向量确定性/词表三方/矩阵冒烟）依赖私有 baseline/ 与
# bin/homeway-go，不在公开 CI 复刻——这些门仍走 tools/ci-local.sh（发版前本地跑）。
# cargo fmt 未启用：仓内无 rustfmt 配置、现有排版非 fmt-clean，本批不整仓重排。
# fuzz 独立 workspace（nightly + cargo-fuzz），不在 cargo test --workspace 内。
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test（${{ matrix.runner }}）
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  clippy:
    name: clippy -D warnings（linux 面）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml 钉 1.99.0——runner 首次自动安装该工具链时不带 clippy
      # 组件（首跑实测 'cargo-clippy' is not installed），显式补装（跟随仓内
      # toolchain 文件的激活目标）。
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  cross-check:
    name: check ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-ohos
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}
      # C 侧前置（M0 设计 §2.6）：ring 0.17 的 build script 在 `cargo check` 下也会编
      # C/汇编（check 只跳过 Rust 后端的 codegen 与链接）。ubuntu-latest 当前自带 clang；
      # 镜像会演进 ⇒ 缺则显式装（R-E）。
      - name: 交叉 check 的 C 侧前置（clang）
        run: which clang || sudo apt-get install -y clang
      - name: 交叉 check（-p 清单含新 crate）+ `-nostdlibinc` 落点断言
        run: |
          set -eo pipefail
          cargo check -v --target ${{ matrix.target }} --locked \
            -p homeway-core -p homeway-cli -p homeway-capi -p homeway-quic 2>&1 | tee /tmp/cc.log
          # 设计门 3.2（R-K）：每条含 -nostdlibinc 的命令行都必须来自 ring
          # （防将来新引入的 C 依赖静默继承 check 档 flag）
          bad="$(grep -- '-nostdlibinc' /tmp/cc.log | grep -v -- '-ring-' || true)"
          [ -z "$bad" ] || { echo "!! -nostdlibinc 落到非 ring 的 C 依赖上："; echo "$bad"; exit 1; }
          # 正向自校准（代码门 ③-2）：热缓存下断言会「空过」（无编译器调用行）⇒ 再查 ring 的
          # C 侧产物确实为本目标产出过（`cargo check` 执行 build script 但不链接）
          ls target/${{ matrix.target }}/debug/build/ring-*/out/libring_core_0_17_14_.a
        env:
          CC_aarch64_unknown_linux_ohos: clang
          CFLAGS_aarch64_unknown_linux_ohos: -nostdlibinc -DRING_CORE_NOSTDLIBINC -isystem ${{ github.workspace }}/tools/cc-check-shim
          CC_aarch64_unknown_linux_musl: clang
          CC_x86_64_unknown_linux_musl: clang
          CFLAGS_x86_64_unknown_linux_musl: -nostdlibinc -DRING_CORE_NOSTDLIBINC -isystem ${{ github.workspace }}/tools/cc-check-shim

  check-quic-isolation:
    name: QUIC 岛隔离源码门（异步/同步边界）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 门是 zsh 脚本（仓内 tools/ 惯例）；镜像若缺 zsh 则显式装
      - run: which zsh || sudo apt-get install -y zsh
      - run: zsh tools/check-quic-isolation.sh

  # WIN 批（2026-10-13）：windows 编译门（x86_64-pc-windows-msvc）。范围 = -p 三 crate
  # （homeway-capi 是 OHOS 专用壳不进 windows 面）；**check 不跑测试**——windows
  # 测试面是后续批（unix 设计的用例面大，WIN-design §0 非目标登记）。ring 在
  # windows runner 上原生 MSVC 构建（无交叉垫片需求）。
  win-check:
    name: check windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
      # 评审 M3：-D warnings（本地交叉 check 已零警告；windows 测试面不在本门——
      # --all-targets 会编 tests〔unix 用例未门控〕，见 WIN-design §0 非目标）。
      - run: cargo check --locked -p homeway-core -p homeway-cli -p homeway-quic
        env:
          RUSTFLAGS: "-D warnings"
      # 运行面最小烟囱：版本横幅 + 纯函数动词（token 解码 = fixtures 向量的第一例
      # ——平台无关面：base64/crc/端点解析）。decode 期望 peer_id 段命中间量向量值。
      # `encoding='utf-8'` 必须显式：windows runner 的 Python 缺省 cp1252，向量文件含
      # UTF-8 中文 ⇒ 缺参会 UnicodeDecodeError（2026-10-13 首轮实测）。
      - name: 运行烟囱（--version / token 向量解码）
        shell: bash
        run: |
          set -eo pipefail
          cargo build --locked -p homeway-cli
          ./target/debug/homeway.exe --version
          TOK=$(python3 -c "import json;print(json.load(open('fixtures/vectors/token_hmw2.json',encoding='utf-8'))['cases'][0]['token'])")
          ./target/debug/homeway.exe token "$TOK" | grep -F "peer_id  = 1111111111111111111111111111111111111111111111111111111111111111"
          echo "win smoke ok"
