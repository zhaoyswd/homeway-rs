[workspace]
resolver = "2"
# 探针独立 workspace（根 Cargo.toml 的 exclude 已排除 tools/quic-ab）。
# **M5 C4**：WG 两臂（`wg-ring`/`wg-shim` 与其 ring 垫片）随 WG 面退役删除——WG 加密栈
# 已无产品消费者，参照臂同批退役（设计 §9.2 默认 (c)：「每包 CPU ≤ 现役 WG+shim ×1.0」
# 「线开销 ≤40B」两条的 WG 相对列失去参照臂，保留绝对列）。
#   size-shell = 空壳档探针（四档矩阵的前两格；转入自 lab 的 size-probe v1 形态）
members = ["common", "raw", "quic", "size", "size-shell"]

[workspace.package]
version = "0.0.0"
edition = "2021"

# ---- lab 档（= /tmp/quic-lab 的口径：release + LTO + panic=abort + strip）----
# **必须写在 workspace 根**：cargo 忽略非根包的 [profile]（只打一条 warning）——M0 设计 §4.4。
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# ---- product 档（跟随仓内 workspace 的默认 release：无 LTO / unwind / cgu=16 / 无 strip）----
# 用 `cargo build --profile product` 构建；档位断言 + 两档尺寸差对照见 tools/quic-ab.sh。
[profile.product]
inherits = "release"
lto = false
panic = "unwind"
codegen-units = 16
strip = "none"
