[package]
name = "quic-ab-size"
version.workspace = true
edition.workspace = true

# 体积探针（OHOS cdylib）：转入自 `/tmp/quic-lab/size-probe2`（lib 143 行 + real_quic 116 行）。
# 四档口径（M0 设计 §4.3/§5.1）由 feature 切换 + profile 切换实现：
#   ① 空壳 cdylib            = 无 feature（boringtun/smoltcp 声明但不引用 ⇒ 死码消除）
#   ② 空壳 + QUIC 全栈        = `--features quic-shallow`（只做 size_of 类浅引用）
#   ③ base + 真实引用全路径    = `--features quic`（ProbeRunQuic 真自连一次）
#   ④ 现役 .so 对照           = 主检出产物（只读，由 harness 量取）
[lib]
name = "clientcore2"
crate-type = ["cdylib"]

[dependencies]
# 近似产品依赖面（boringtun + smoltcp 是核里最大的两块；QUIC 增量在「它们已在场」时测）
boringtun = "0.6"
smoltcp = { version = "0.14", features = ["socket-tcp-cubic", "socket-tcp-reno"] }
libc = "0.2"
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "io-util"], optional = true }
bytes = "1"

[features]
# 浅引用档：QUIC 依赖全在，但只被 size_of/常量级引用 ⇒ 量「依赖在场」的死码消除后成本
quic-shallow = ["dep:quinn", "dep:rustls", "dep:tokio"]
# 真引用档：全路径可达（含自连握手）
quic = ["quic-shallow"]

[[bin]]
name = "real_quic"
path = "src/bin/real_quic.rs"
required-features = ["quic"]
