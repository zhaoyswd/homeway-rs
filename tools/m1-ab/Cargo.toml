[workspace]
# 探针独立 workspace（同 tools/quic-probe 先例：根 Cargo.toml 的 exclude 已排除本目录）。
# 为什么独立：本工具是 **harness-only** 的**产品路径**驱动面（把 `homeway-core::facade`
# 当库用：ClientCore 世代装配 + 岛 API），**不进产品面**（`crates/` 才是产品面；
# `tools/check-quic-isolation.sh` 只扫 `crates/`——放这里即与产品面隔离）。
# 注意：本 workspace **不带** [patch]（M5 C4 起根 workspace 也没有 patch 了）⇒ 它把
# homeway-quic → quinn/rustls 的**真 ring** 链进来（macOS 可用；OHOS 不构建本工具）。
resolver = "2"
members = ["."]

[package]
name = "m1-ab"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
homeway-core = { path = "../../crates/homeway-core" }
homeway-quic = { path = "../../crates/homeway-quic" }
serde_json = "1"
# socketpair 缓冲放大（SO_SNDBUF/SO_RCVBUF——测量面鲁棒性，见 main.rs bump_bufs）
libc = "0.2"
